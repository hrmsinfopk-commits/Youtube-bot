# ===========================================================
#  Tomorrowly - YouTube Bot Settings (sirf yahi file badalni hai)
# ===========================================================

channel:
  name: "Tomorrowly"
  niche: "Newest breakthroughs in science and the future: AI, robots, space and NASA missions, rockets, flying cars, new gadgets, future transport and energy, and new defense/military technology explained"
  audience: "Curious English-speaking viewers worldwide (mainly US, UK, Canada, Australia, India), age 16-45, who love tech and space news explained simply"
  language: "english"                  # english | urdu | hindi
  captions: "roman"                    # english mein captions wahi text hota hai jo awaaz bolti hai
  extra_instructions: ""

shorts:
  per_run: 1
  target_seconds: 30                   # (sirf tab jab format pata na ho)
  seconds_by_format:                   # khabar = tez jhatka; bara sawal = jawab samjhane ka waqt
    news: 22                           # 20-25 second
    big question: 32                   # 30-35 second
  big_question_days: ["mon", "thu"]    # in dinon ki Short "bara sawal" (sada-bahar), baqi din trending khabar

long:
  per_run: 1
  target_minutes: 3.5                  # 3-4 minute: ek topic, shuru se aakhir tak ek kahani (baad mein data dekh kar barhayenge)
  formats_by_day:                      # din (UTC) ke hisaab se long video ki qisam
    wed: "news"                        # Budh: trending khabar ki deep dive
    sat: "big question"                # Hafta: sada-bahar "bara sawal" (mahino tak views laati hai)

upload:
  enabled: true                        # false = sirf video banegi, upload nahi (GitHub se download kar lein)
  privacy: "public"                    # public | private (private = pehle aap dekhen, phir khud public karen)
  long_privacy: "public"               # long videos bhi seedhi public (review ke liye "private" kar sakte hain)
  category_id: "28"                    # 28 = Science & Technology
  made_for_kids: false
  link_long_video_in_shorts: true      # Shorts ki description mein latest long video ka link

# Trending topics: asli khabrein + YouTube par is waqt kya dekha ja raha hai
trends:
  enabled: true
  news_queries: ["new technology", "artificial intelligence", "NASA", "SpaceX", "space discovery", "robot",
                 "flying car", "new gadget", "military technology", "electric vehicle", "quantum computer", "breakthrough science"]
  youtube_keywords: ["new technology", "AI news", "NASA", "space news", "future technology", "robots", "flying car", "new weapon technology"]
  region: "US"
  avoid_weapons_ratio: 0.2             # hathiyar wale topics zyada se zyada itne hisse (ads kam milte hain)
  # "bara sawal" videos ke liye: pichhle saal ki sab se zyada dekhi gayi explainer videos
  evergreen_keywords: ["how does it work", "why can't we", "how is it possible", "engineering explained",
                       "how do they build", "why don't planes", "what happens if", "science explained"]

gemini:
  # Free key: https://aistudio.google.com/apikey  (GitHub secret: GEMINI_API_KEY)
  models: ["gemini-3.8-flash", "gemini-flash-latest", "gemini-flash-lite-latest"]
  use_google_search_for_trends: false   # free key par Google Search band hai

# Awaaz: "gemini" = Google ki natural awaaz (isi Gemini key se).
# Gemini awaaz na mile (limit / error) to bot khud neeche wali Microsoft awaaz use karta hai.
tts:
  engine: "gemini"
  host_voice: "Charon"                 # channel ka ek mustaqil narrator (log awaaz pehchanne lagte hain)
  models: ["gemini-3.1-flash-tts-preview", "gemini-2.5-flash-preview-tts"]
  chunk_words: 160
  voices:
    male: ["Charon", "Orus", "Puck", "Iapetus"]
    female: ["Kore", "Aoede", "Zephyr", "Sulafat"]
  style: >-
    Read this like a popular, energetic YouTube science and tech creator talking to a friend: natural American English,
    curious and genuinely amazed, confident, conversational, medium-fast pace, clear emphasis on surprising facts and numbers,
    short natural breaths, never robotic, never like a news anchor

voice_rate: [0, 8]                     # sirf Microsoft backup awaaz ke liye
words_per_second: 2.35                 # English awaaz ki asal raftaar (test se naapi gayi)

voices:
  urdu:    ["ur-PK-AsadNeural", "ur-PK-UzmaNeural", "ur-IN-SalmanNeural", "ur-IN-GulNeural"]
  hindi:   ["hi-IN-MadhurNeural", "hi-IN-SwaraNeural"]
  english:
    male: ["en-US-AndrewNeural"]       # backup awaaz bhi ek hi (host jaisi)
    female: ["en-US-AvaNeural", "en-US-EmmaNeural", "en-US-JennyNeural"]

footage:
  sources: ["nasa", "pexels", "pixabay"]   # nasa = NASA ki asli videos/tasveeren (space topics par pehle)
  # Music: 1) music/ folder ki files  2) Freesound CC0 (FREESOUND_API_KEY)  3) bot ka apna banaya music
  exclude_tags: ["alien", "ufo", "fantasy", "monster", "dragon", "cartoon", "anime", "magic", "zombie", "game",
                 "green screen", "greenscreen", "chroma", "chroma key", "birthday", "candles", "zodiac", "horoscope",
                 "astrology", "wedding", "christmas", "halloween", "valentine",
                 "interview", "press conference", "briefing", "speaks", "talks about", "panel discussion",
                 "infographic", "diagram", "instruments labeled"]
  reject_text: true                    # jis clip mein pehle se likha hua text/subtitles hon, woh skip
  relevance_check: true                # Gemini har scene ki footage check karta hai ke line se milti hai ya nahi
  concept_images: true                 # kuch na mile to AI "Concept illustration" (screen par likha hota hai)
  concept_style: "realistic cinematic concept art, photorealistic lighting, generic design (no real brand, no logo)"
  music_volume: 0.27                   # background music (awaaz ke neeche khud dheema hota hai)
  sfx_volume: 0.6                      # whoosh/boom ki awaaz (0 = band)

visual:
  sound_design: true                   # Freesound CC0 sound effects (rocket, beep, engine...)
  brand_color: [34, 211, 238]          # Tomorrowly cyan: captions, progress bar, graphics
  watermark: true                      # chhota Tomorrowly logo kone mein

# Har video ka andaaz in mein se chuna jata hai (analytics se seekh kar achhe andaaz zyada chune jate hain)
styles:
  - "What if: put the viewer inside a vivid 'what if you...' scenario built on the real news"
  - "Countdown: 3-5 surprising facts about it, the most shocking one last"
  - "Myth vs fact: what people assume vs what is actually true"
  - "Explainer: one big question, answered step by step with a surprise at the end"
  - "Future scenario: 'It's 2040...' - show how this changes everyday life"
  - "Shocking fact first: open with the most unbelievable detail, then explain why"
  - "Before vs now: how this used to work vs what just changed"
