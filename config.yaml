# ===========================================================
#  YouTube Bot Settings: sirf yahi file badalni hai
# ===========================================================

channel:
  name: "Tomorrowly"                   # aapke channel ka naam (outro/description mein aata hai)
  niche: "AI aur Future Technology: robots, AI tools, space tech, future gadgets, science ki nayi khoj"
  audience: "Pakistan aur India ke 16-35 saal ke log jo Urdu/Hindi samajhte hain"
  language: "urdu"                     # urdu | hindi | english  (awaaz ki zubaan)
  captions: "roman"                    # roman = Roman Urdu captions (PK + India dono parh saken) | native = Urdu/Hindi script
  extra_instructions: ""               # koi khaas hidayat, jaise "har video mein Pakistan ka zikr ho"

shorts:
  per_run: 1                           # har run mein kitne Shorts (workflow din mein 3 dafa chalta hai)
  target_seconds: 40                   # research: 30-50 second wali Shorts sab se zyada aakhir tak dekhi jati hain

long:
  per_run: 1
  target_minutes: 8                    # 8-10 minute: watch hours ke liye best

upload:
  enabled: true                        # false = sirf video banegi, upload nahi (GitHub se download kar lein)
  privacy: "public"                    # public | private (private = pehle aap dekhen, phir khud public karen)
  category_id: "28"                    # 28 = Science & Technology
  made_for_kids: false
  link_long_video_in_shorts: true      # Shorts ki description mein latest long video ka link

gemini:
  # Free key: https://aistudio.google.com/apikey  (GitHub secret: GEMINI_API_KEY)
  models: ["gemini-3.8-flash", "gemini-flash-latest", "gemini-flash-lite-latest"]
  use_google_search_for_trends: false   # free key par Google Search band hai

# Awaaz: "gemini" = Google ki natural, insaan jaisi Urdu awaaz (isi Gemini key se).
# Agar Gemini awaaz na mile (limit / error) to bot khud neeche wali Microsoft awaaz use karta hai.
tts:
  engine: "gemini"
  models: ["gemini-3.1-flash-tts-preview", "gemini-2.5-flash-preview-tts"]
  chunk_words: 140
  voices:
    male: ["Charon", "Orus", "Algenib", "Iapetus"]
    female: ["Kore", "Aoede", "Sulafat", "Gacrux"]
  style: >-
    Read this in natural, fluent Pakistani Urdu like a popular, energetic YouTube science creator talking to a friend:
    curious, amazed, confident, conversational, medium-fast pace, clear emphasis on surprising words, short natural breaths,
    never robotic, never like a news reader

voices:
  urdu:    ["ur-PK-AsadNeural", "ur-PK-UzmaNeural", "ur-IN-SalmanNeural", "ur-IN-GulNeural"]
  hindi:   ["hi-IN-MadhurNeural", "hi-IN-SwaraNeural"]
  english: ["en-US-AndrewNeural", "en-US-AvaNeural", "en-GB-RyanNeural", "en-US-BrianNeural"]

footage:
  sources: ["pexels", "pixabay"]       # keys: PEXELS_API_KEY, PIXABAY_API_KEY
  # Music: 1) music/ folder ki files  2) Freesound CC0 (FREESOUND_API_KEY)  3) bot ka apna banaya music
  exclude_tags: ["alien", "ufo", "fantasy", "monster", "dragon", "cartoon", "anime", "magic", "zombie", "game"]
  music_volume: 0.22                   # background music (awaaz ke neeche khud dheema hota hai)
  sfx_volume: 0.6                      # whoosh/boom ki awaaz (0 = band)

# Har video ka andaaz in mein se random chuna jata hai, taake har video alag lage
styles:
  - "Countdown: top 3-5 cheezein, sab se zabardast aakhir mein"
  - "Story: ek kirdaar ya waqia, suspense ke saath"
  - "Myth vs Fact: log kya samajhte hain aur sach kya hai"
  - "Sawal-jawab: ek bada sawal, phir step by step jawab"
  - "Future scenario: 'Socho saal 2040 hai...' wala andaaz"
  - "Shocking fact: ek hairan kar dene wali baat se shuru, phir wajah"
  - "Comparison: pehle vs ab, ya do cheezon ka muqabla"
