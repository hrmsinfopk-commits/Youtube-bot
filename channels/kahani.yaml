# ===========================================================
#  Doosra channel: Kahaniyan (horror / mystery / crime fiction)
#  Sirf woh settings yahan hain jo config.yaml se alag hain.
# ===========================================================

channel:
  name: "Raat Ki Kahaniyan"           # apne channel ka naam yahan likhein
  mode: "stories"
  niche: "Original Urdu horror, mystery aur crime/thriller kahaniyan (fiction), twist endings ke saath"
  audience: "Pakistan aur India ke 16-40 saal ke log jo raat ko darawni aur suspense kahaniyan sunna pasand karte hain"
  language: "urdu"
  captions: "roman"
  fallback_keywords: ["dark corridor", "foggy forest", "night road", "abandoned house"]
  extra_instructions: ""

shorts:
  target_seconds: 50

long:
  target_minutes: 9

upload:
  category_id: "24"                   # 24 = Entertainment

visual:
  grade: "dark"                       # andheri, thandi rangat + vignette
  palette: "horror"                   # laal / safed captions
  caption_style: "story"              # typewriter font, aahista ubharte captions, bina pop
  shot_seconds: [4.5, 7.5]            # har shot zyada der tak (horror mein jaldi cut nahi)
  grain: 9                            # purani film jaisa grain
  progress_bar: true

# awaaz: dheemi, gehri, halki goonj; har jumle ke baad saans
voice_fx: "horror"
voice_rate: [-14, -7]
voice_pitch: [-6, -2]
pauses: [0.55, 0.95]
reveal_pause: 1.4
words_per_second: 2.3

voices:
  urdu:
    male: ["ur-PK-AsadNeural", "ur-IN-SalmanNeural"]
    female: ["ur-PK-UzmaNeural", "ur-IN-GulNeural"]

footage:
  music_volume: 0.26
  sfx_volume: 0.7
  # Kahani ke har scene ki footage sirf in mahauli cheezon se dhoondi jati hai
  vocabulary: ["dark corridor", "abandoned house", "abandoned building", "old door", "door opening", "dark room",
               "empty room", "flickering light", "light bulb", "candle", "candle flame", "foggy forest", "dark forest",
               "night forest", "fog", "mist", "night road", "empty road", "street light", "night city", "rain window",
               "rain night", "thunder", "lightning", "storm clouds", "full moon", "moon clouds", "night sky", "old mirror",
               "mirror", "shadow", "silhouette", "staircase", "old stairs", "hallway", "basement", "attic", "old clock",
               "clock", "cemetery", "graveyard", "tombstone", "old well", "village night", "haunted", "smoke",
               "dark water", "lake night", "train night", "railway night", "old photo", "old camera", "telephone",
               "phone dark", "window night", "curtain wind", "crow", "owl", "spider web", "dead tree", "hospital corridor",
               "empty hospital", "old book", "old key", "footsteps", "hand shadow", "eyes dark"]
  exclude_tags: ["smile", "smiling", "happy", "laugh", "laughing", "fun", "party", "celebration", "beach", "summer",
                 "sunny", "flowers", "business", "office", "wedding", "love", "couple", "kids", "children", "child",
                 "baby", "toy", "cute", "puppy", "kitten", "food", "christmas", "holiday", "sport", "fitness"]

styles:
  - "Pehla shakhs (main) apni aap beeti sunata hai, dheemi aur sargoshi wali awaaz mein"
  - "Raat ki shift: hospital, chowkidar, call center ya highway dhaba"
  - "Purani haveli ya gaon: khandani raaz aur purane waqiat"
  - "Ajeeb phone call, message ya voice note jo nahi aana chahiye tha"
  - "Crime thriller: ek chhoti si galti jo poora sach khol deti hai"
  - "Sach ya wehem? aakhir tak shak rahe ke yeh bhoot tha ya insaan"
  - "Safar ki kahani: aakhri train, sunsan sadak, ya ajnabi musafir"
