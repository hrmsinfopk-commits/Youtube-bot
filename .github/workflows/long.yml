name: Tomorrowly Long Videos

on:
  schedule:
    # UTC. Wednesday + Saturday 6:00 PM Pakistan = 9:00 AM US East (video ~45 min baad upload)
    - cron: "0 13 * * 6"
  workflow_dispatch: {}        # "Run workflow" button se kabhi bhi chala sakte hain
  push:
    paths: [".github/trigger-long.txt"]   # is file ko badalne se bhi bot chalta hai

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache speech model (captions sync)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en-v1

      - name: Install tools
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          timeout 900 sudo apt-get install -y -qq --no-install-recommends -o Acquire::Retries=3 ffmpeg libraqm0 tesseract-ocr > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg libraqm0 tesseract-ocr > /dev/null)
          pip install -q -r requirements.txt
          bash scripts/get_fonts.sh

      - name: Make & upload video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_KAHANI: ${{ secrets.YT_REFRESH_TOKEN_KAHANI }}
        run: |
          ARGS=""
          # trigger file mein 'test' likha ho to video banegi magar upload nahi hogi
          if [ "${{ github.event_name }}" = "push" ] && grep -qi test .github/trigger-long.txt; then ARGS="--no-upload"; fi
          # trigger file mein "big question" ya "news" likha ho to us din ka format badal jata hai
          if [ "${{ github.event_name }}" = "push" ]; then
            if grep -qi "big question" .github/trigger-long.txt; then export BOT_FORMAT="big question";
            elif grep -qiw "news" .github/trigger-long.txt; then export BOT_FORMAT="news"; fi
          fi
          python -m bot.main --channel future --type long $ARGS 2>&1 | python scripts/redact.py data/last_run_future_long.log

      - name: Save video for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: future-long-${{ github.run_number }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Save history
        if: always()
        run: |
          git config user.name "yt-bot"
          git config user.email "yt-bot@users.noreply.github.com"
          # another run may have saved at the same time -> merge instead of losing this run's history
          BASE=$(git rev-parse HEAD); MINE="$RUNNER_TEMP/mine"; rm -rf "$MINE"; mkdir -p "$MINE"
          cp -r data topics*.txt thumbnails "$MINE"/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python scripts/merge_data.py "$BASE" "$MINE"
            git add data/ topics*.txt thumbnails/ 2>/dev/null || git add data/ topics*.txt
            if git diff --cached --quiet; then echo "nothing to save"; break; fi
            git commit -q -m "bot: history update (future long)" && git push -q origin HEAD:main && echo "saved" && break
            sleep $((5 + RANDOM % 15))
          done
