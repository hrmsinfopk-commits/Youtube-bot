name: Tomorrowly Analytics

on:
  schedule:
    # UTC. Roz 8:00 AM Pakistan. Monday ko haftawar REPORT.md bhi banta hai.
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  push:
    paths: [".github/trigger-analytics.txt"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q -r requirements.txt
      - name: Read YouTube analytics, learn, report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m bot.analytics --channel future 2>&1 | python scripts/redact.py data/last_run_analytics.log
      - name: Save
        if: always()
        run: |
          git config user.name "yt-bot"
          git config user.email "yt-bot@users.noreply.github.com"
          git add data/ REPORT.md 2>/dev/null || git add data/
          git diff --cached --quiet || git commit -m "bot: analytics update"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
