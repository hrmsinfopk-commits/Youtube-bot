name: Tomorrowly Analytics

on:
  schedule:
    # UTC. Roz 8:00 AM Pakistan. Monday ko haftawar REPORT.md bhi banta hai.
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  push:
    paths: [".github/trigger-analytics.txt"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q -r requirements.txt
      - name: Read YouTube analytics, learn, report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m bot.analytics --channel future 2>&1 | python scripts/redact.py data/last_run_analytics.log
      - name: Save
        if: always()
        run: |
          git config user.name "yt-bot"
          git config user.email "yt-bot@users.noreply.github.com"
          # another run may have saved at the same time -> merge instead of losing this run's history
          BASE=$(git rev-parse HEAD); MINE="$RUNNER_TEMP/mine"; rm -rf "$MINE"; mkdir -p "$MINE"
          cp -r data topics*.txt REPORT.md "$MINE"/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python scripts/merge_data.py "$BASE" "$MINE"
            git add data/ topics*.txt REPORT.md 2>/dev/null || git add data/
            if git diff --cached --quiet; then echo "nothing to save"; break; fi
            git commit -q -m "bot: analytics update" && git push -q origin HEAD:main && echo "saved" && break
            sleep $((5 + RANDOM % 15))
          done
