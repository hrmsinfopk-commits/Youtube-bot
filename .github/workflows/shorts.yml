name: Daily Shorts

on:
  schedule:
    # UTC time. Pakistan = UTC+5  ->  9:30 AM, 3:30 PM, 8:30 PM PKT
    - cron: "30 4 * * *"
    - cron: "30 10 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch: {}        # "Run workflow" button se kabhi bhi chala sakte hain

permissions:
  contents: write

concurrency:
  group: yt-bot
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libraqm0 > /dev/null
          pip install -q -r requirements.txt
          bash scripts/get_fonts.sh

      - name: Make & upload Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m bot.main --type short

      - name: Save video for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Save history
        if: always()
        run: |
          git config user.name "yt-bot"
          git config user.email "yt-bot@users.noreply.github.com"
          git add data/history.json topics.txt
          git diff --cached --quiet || git commit -m "bot: history update"
          git pull --rebase -q && git push -q || true
