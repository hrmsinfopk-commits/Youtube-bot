name: Tomorrowly Shorts

on:
  schedule:
    # UTC. Roz 7:00 PM Pakistan = 10:00 AM US East (video ~20 min baad upload)
    - cron: "0 14 * * *"
  workflow_dispatch: {}        # "Run workflow" button se kabhi bhi chala sakte hain
  push:
    paths: [".github/trigger-short.txt"]   # is file ko badalne se bhi bot chalta hai

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libraqm0 > /dev/null
          pip install -q -r requirements.txt
          bash scripts/get_fonts.sh

      - name: Make & upload video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_KAHANI: ${{ secrets.YT_REFRESH_TOKEN_KAHANI }}
        run: |
          ARGS=""
          # trigger file mein 'test' likha ho to video banegi magar upload nahi hogi
          if [ "${{ github.event_name }}" = "push" ] && grep -qi test .github/trigger-short.txt; then ARGS="--no-upload"; fi
          python -m bot.main --channel future --type short $ARGS 2>&1 | python scripts/redact.py data/last_run_future_short.log

      - name: Save video for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: future-short-${{ github.run_number }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Save history
        if: always()
        run: |
          git config user.name "yt-bot"
          git config user.email "yt-bot@users.noreply.github.com"
          git add data/ topics*.txt
          git diff --cached --quiet || git commit -m "bot: history update (future short)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
