name: AI singer cover - fast parallel (side tool)

# Same as cover.yml, but each AI voice runs in its own job at the same time, with fewer CPU-heavy settings,
# and a progress file (song/progress/<voice>.txt, log tail only - no audio, no lyrics) every 4 minutes.

on:
  workflow_dispatch: {}
  push:
    paths: ["song/cover2_request.txt"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cover:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        voice: [A_urdu_male, B_hindi_male]
    env:
      V: ${{ matrix.voice }}
      ID: ${{ github.run_id }}_${{ matrix.voice }}
      GH_TOKEN: ${{ github.token }}
      COVER_VOICE: ${{ matrix.voice }}
      COVER_STEPS: "15"
      COVER_REF_SEC: "9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: One-time key for this job (publish public half)
        run: |
          mkdir -p /tmp/rk song/runner
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/rk/private.pem 2>/dev/null
          openssl pkey -in /tmp/rk/private.pem -pubout -out song/runner/$ID.pem
          git config user.name "yt-bot"
          git config user.email "yt-bot@users.noreply.github.com"
          git add song/runner && git commit -qm "cover2: runner key $ID"
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 9 + 3)); done
      - name: Install separation + voice conversion
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null || true
          python -m venv /tmp/sep && /tmp/sep/bin/pip install -q "audio-separator[cpu]"
          git clone -q --depth 1 https://github.com/Plachtaa/seed-vc.git /tmp/seedvc
          pip install -q torch==2.4.0 torchaudio==2.4.0 --index-url https://download.pytorch.org/whl/cpu
          grep -viE "torch|gradio|FreeSimpleGUI|sounddevice|--pre" /tmp/seedvc/requirements.txt > /tmp/req.txt
          pip install -q -r /tmp/req.txt
          pip install -q edge-tts soundfile
          # print a line after every converted chunk, so the progress file shows how far it is
          python - <<'EOF'
          from pathlib import Path
          p = Path("/tmp/seedvc/inference.py"); s = p.read_text()
          a = "        vc_wave = vc_wave[None, :]\n"
          assert a in s
          s = s.replace(a, a + "        print(f'chunk {processed_frames}/{cond.size(1)} frames  {time.time() - time_vc_start:.0f}s', flush=True)\n", 1)
          p.write_text(s)
          EOF
      - name: Wait for the encrypted input
        run: |
          for i in $(seq 1 100); do
            git fetch -q origin main
            if git cat-file -e FETCH_HEAD:song/in/$ID.key.enc 2>/dev/null; then
              git show FETCH_HEAD:song/in/$ID.key.enc > /tmp/in.key.enc
              git show FETCH_HEAD:song/in/$ID.tar.enc > /tmp/in.tar.enc
              openssl pkeyutl -decrypt -inkey /tmp/rk/private.pem -in /tmp/in.key.enc -out /tmp/in.key
              mkdir -p /tmp/work && openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/in.tar.enc -pass file:/tmp/in.key | tar -x -C /tmp/work
              ls -la /tmp/work; exit 0
            fi
            sleep 15
          done
          echo "input never arrived"; exit 1
      - name: Make the AI cover (one voice)
        run: |
          python -u scripts/make_cover.py /tmp/work /tmp/out /tmp/seedvc /tmp/sep/bin/audio-separator > /tmp/cover.log 2>&1 &
          pid=$!
          f="song/progress/$V.txt"
          while kill -0 $pid 2>/dev/null; do
            sleep 240
            { date -u; tail -n 25 /tmp/cover.log | cut -c1-200; } > /tmp/hb.txt
            sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$f?ref=main" -q .sha 2>/dev/null || true)
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$f" -f message="cover2: progress $V" \
              -f content="$(base64 -w0 /tmp/hb.txt)" ${sha:+-f sha=$sha} > /dev/null 2>&1 || true
          done
          wait $pid; rc=$?
          tail -n 40 /tmp/cover.log
          exit $rc
      - name: Save (encrypted for the owner)
        if: always()
        run: |
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard FETCH_HEAD
            mkdir -p song/cover_out2
            cp /tmp/cover.log song/cover_out2/log_$V.txt 2>/dev/null || true
            for f in /tmp/out/*; do
              [ -f "$f" ] || continue
              k=$(openssl rand -hex 32); echo -n "$k" > /tmp/k
              n=$(basename "$f")
              openssl enc -aes-256-cbc -pbkdf2 -salt -in "$f" -out "song/cover_out2/$n.enc" -pass file:/tmp/k
              openssl pkeyutl -encrypt -pubin -inkey song/pubkey.pem -in /tmp/k -out "song/cover_out2/$n.key.enc"
            done
            rm -f /tmp/k song/in/$ID.* song/runner/$ID.pem song/progress/$V.txt
            git add -A song && git commit -qm "cover2: output $ID" || exit 0
            git push -q && exit 0
            sleep $((RANDOM % 9 + 4))
          done
          exit 1
